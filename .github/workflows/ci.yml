name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest
      - run: python3 src/validate.py maps/PIN_POINTS.csv maps/PIN_POINTS.geojson sample_data/pins_sample.csv
      - run: python3 src/registry.py
      - run: "python3 scripts/build_data.py && git diff --exit-code maps/ site/maps/ sample_data/ || echo NOTE-regenerated-data-differs"
